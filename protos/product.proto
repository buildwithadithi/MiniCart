syntax = "proto3";

package minicart.product.v1;

import "google/protobuf/timestamp.proto";

message Product {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string price = 4;
  google.protobuf.Timestamp created_at = 5;
}

message AddProductRequest {
  string name = 1;
  string description = 2;
  string price = 3;
  int32 initial_stock = 4;
}

message AddProductResponse {
  Product product = 1;
}

message GetProductRequest {
  int64 product_id = 1;
}

message GetProductResponse {
  Product product = 1;
}

message CheckStockRequest {
  int64 product_id = 1;
}

message CheckStockResponse {
  bool product_exists = 1;
  int32 available_stock = 2;
}

message UpdateStockRequest {
  int64 product_id = 1;
  int32 quantity_delta = 2;
}

message UpdateStockResponse {
  int32 available_stock = 1;
}

service ProductService {
  // Adds a product and its initial inventory record.
  rpc AddProduct(AddProductRequest) returns (AddProductResponse);

  // Retrieves a product by its identifier.
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);

  // Checks whether a product exists and reports its available stock.
  rpc CheckStock(CheckStockRequest) returns (CheckStockResponse);

  // Applies a signed change to a product's available stock.
  rpc UpdateStock(UpdateStockRequest) returns (UpdateStockResponse);
}
